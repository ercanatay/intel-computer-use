name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: PYTHONPATH=python python3 -m unittest discover -s python_tests -v
  native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift run bridge-core-checks
      - run: swift run compatibility-checks
      - run: swift build --product intel-computer-use-compat
      - run: bash scripts/build.sh
